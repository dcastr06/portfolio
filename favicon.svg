<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c0535" />
      <stop offset="100%" stop-color="#090113" />
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#b46efe" />
    </linearGradient>
  </defs>

  <!-- Container with subtle border -->
  <rect width="64" height="64" rx="16" fill="url(#bg)" stroke="#7c3aed" stroke-width="2" />

  <!-- Monogram: DC. with C in purple -->
  <text x="50%" y="53%" text-anchor="middle" dominant-baseline="middle"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="29" font-weight="900" letter-spacing="-1">
    <tspan fill="#ffffff">D</tspan><tspan fill="url(#purpleGlow)">C</tspan><tspan fill="url(#purpleGlow)">.</tspan>
  </text>
</svg>

